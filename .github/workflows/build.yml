name: Build Windows app

on:
  push:
    tags: ["v*"]          # publishing a release with a new tag (e.g. v0.2.1) builds and attaches the zip
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build MediaOrg.exe (desktop app)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name MediaOrg
          --add-data "ui;ui"
          --collect-all pillow_heif --collect-all webview
          --hidden-import mediaorg
          app.py

      - name: Bundle ffprobe (LGPL build) and docs
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force dist/MediaOrg/tools | Out-Null
          Get-ChildItem ff -Recurse -Filter ffprobe.exe | Copy-Item -Destination dist/MediaOrg/tools/
          Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Copy-Item -Destination dist/MediaOrg/tools/   # phase 2: keyframes (GPU decode)
          Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination dist/MediaOrg/tools/FFMPEG-LICENSE.txt
          Copy-Item README.md, LICENSE dist/MediaOrg/

      - name: Phase 2 tests (real ffmpeg, fake Ollama)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:PATH = "$PWD/dist/MediaOrg/tools;$env:PATH"
          python tests/test_analyze.py
          python tests/test_overnight.py

      - name: Self-test the packaged app (as if extracted from a downloaded zip)
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Mark every file "from the internet" like a browser download does, so the test catches blocked-DLL problems
          # (the exe itself is left unmarked so Windows doesn't show a security prompt on the headless runner)
          Get-ChildItem dist/MediaOrg/_internal -Recurse -File | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $p = Start-Process dist/MediaOrg/MediaOrg.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP/mediaorg_selftest.txt"
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          if (-not (Select-String -Path "$env:TEMP/mediaorg_selftest.txt" -Pattern "unblocked=[1-9]" -Quiet)) { throw "files were not unblocked" }
          Get-ChildItem dist/MediaOrg -Recurse -File | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }

      - name: UI test in the real app window
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process dist/MediaOrg/MediaOrg.exe -ArgumentList "--uitest" -Wait -PassThru
          Get-Content "$env:TEMP/mediaorg_uitest.txt"
          if ($p.ExitCode -ne 0) { throw "UI test failed ($($p.ExitCode))" }

      - name: Zip
        shell: pwsh
        run: |
          $name = "${{ github.ref_name }}" -replace '[\\/:]', '-'
          Compress-Archive -Path dist/MediaOrg -DestinationPath "MediaOrg-$name-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaOrg-windows
          path: MediaOrg-*-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MediaOrg-*-windows.zip
          generate_release_notes: true
