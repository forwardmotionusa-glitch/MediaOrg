name: Build Windows app

on:
  push:
    tags: ["v*"]          # pushing a tag like v0.1.1 publishes a new release
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build MediaOrg.exe
        run: pyinstaller --noconfirm --onedir --console --name MediaOrg --collect-all pillow_heif mediaorg.py

      - name: Bundle ffprobe (LGPL build) and docs
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          New-Item -ItemType Directory -Force dist/MediaOrg/tools | Out-Null
          Get-ChildItem ff -Recurse -Filter ffprobe.exe | Copy-Item -Destination dist/MediaOrg/tools/
          Get-ChildItem ff -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination dist/MediaOrg/tools/FFMPEG-LICENSE.txt
          Copy-Item README.md, LICENSE dist/MediaOrg/
          & dist/MediaOrg/MediaOrg.exe --help

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/MediaOrg -DestinationPath "MediaOrg-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaOrg-windows
          path: MediaOrg-*-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MediaOrg-*-windows.zip
          generate_release_notes: true
